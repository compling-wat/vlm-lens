# Credit: https://github.com/niketagrawal

name: Build-sphinx-docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"

      - name: Install doc dependencies
        run: uv sync --extra docs

      - name: Render model cards from JSON
        run: uv run --active python scripts/build_model_cards.py

      - name: Build HTML
        run: uv run --active make html
        working-directory: docs

      - name: Install ghp-import
        run: uv tool install ghp-import

      - name: Configure Git for push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run ghp-import
        run: ghp-import -n -p -f docs/_build/html
