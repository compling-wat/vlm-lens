[project]
name = "vlm-lens"
version = "0.1.0"
description = "Mechanistic analysis toolkit for vision-language models"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyyaml>=6",
    "tqdm>=4.64",
    "requests>=2.31",
]

[project.optional-dependencies]
base = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "datasets==3.6.0",
    "huggingface-hub==0.30.2",
    "accelerate==1.10.1",
    "sentencepiece==0.2.0",
    "protobuf==6.32.1",
    "pillow==11.1.0",
    "wget==3.2",
]

cogvlm = [
    "torch==2.1.1",
    "torchvision==0.16.1",
    "xformers==0.0.23",  # bumped from 0.0.22.post7 to match torch 2.1.1 (was pinned to torch 2.1.0)
    "transformers==4.35.0",
    "accelerate==0.24.1",
    "datasets==2.14.7",
    "huggingface-hub==0.17.3",
    "sentencepiece==0.1.99",
    "einops==0.7.0",
    "matplotlib==3.9.0",
    "pandas==2.2.1",
    "scipy==1.13.1",
    "opencv-python==4.8.1.78",
    "opencv-contrib-python==4.8.1.78",
    "opencv-python-headless==4.8.1.78",
    "opencv-contrib-python-headless==4.8.1.78",
    "pillow==10.3.0",
]

# NOTE: glamm does not pin torch — historically installed separately from
# the PyTorch CUDA 11.7 index (see envs/glamm/apptainer/vlmlens_cuda11.def).
# Users should install torch manually BEFORE `uv sync --extra glamm`, e.g.:
#   uv pip install torch==1.13.1+cu117 torchvision==0.14.1+cu117 torchaudio==0.13.1 \
#       --index-url https://download.pytorch.org/whl/cu117
# Then: uv sync --extra glamm --inexact  (keeps the torch you just installed)
glamm = [
    "transformers @ git+https://github.com/huggingface/transformers.git@cae78c46",
    "accelerate==0.25.0",
    "datasets==2.19.1",
    "huggingface-hub==0.33.4",
    "diffusers==0.22.3",
    "peft==0.5.0",
    "gradio==3.35.2",
    "gradio-client==0.2.7",
    "scikit-image==0.22.0",
    "scikit-learn==1.3.2",
    "scipy==1.11.2",
